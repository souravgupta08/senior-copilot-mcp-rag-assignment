name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Format check
        run: ruff format --check .
      - name: Lint + static analysis (ruff incl. bugbear and bandit rules)
        run: ruff check .
      - name: Build RAG index
        run: python -m rag.ingestion.ingest
      - name: Unit tests
        run: pytest -q tests/unit
      - name: RAG tests
        run: pytest -q rag/tests
      - name: MCP + integration tests
        run: pytest -q tests/integration
      - name: End-to-end tests (MCP + RAG) with coverage
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
      - name: Dependency audit
        run: pip-audit -r requirements.txt
        continue-on-error: true

  postman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt && npm install -g newman
      - name: Start simulator
        run: |
          ALARM_API_TOKEN=demo-token uvicorn apps.alarm_simulator.main:app --port 8000 &
          sleep 5
      - name: Run Postman collections
        run: bash scripts/run_postman.sh http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d --wait
      - name: Smoke test through the GUI backend
        run: |
          curl -fs http://localhost:8080/health
          curl -fs -X POST http://localhost:8080/api/chat -H "Content-Type: application/json" \
            -d '{"message":"Investigate Boiler Feed Pump 101 over the last 90 days"}' | grep -q '"success":true'
      - name: Stop
        if: always()
        run: docker compose down
